server:
  port: 18004
spring:
  application:
    name: web-app
  web:
    resources:
      static-locations: classpath:/static/
      chain:
        enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    status-page-url: http://localhost:18004/login.html
