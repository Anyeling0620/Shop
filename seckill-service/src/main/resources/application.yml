server:
  port: 18007
spring:
  application:
    name: seckill
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/seckill?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 12345678
    type: com.alibaba.druid.pool.DruidDataSource
    # 连接池参数请写在 spring.datasource.druid.* 下并引入 druid-spring-boot-starter，
    # 仅依赖 druid 时 spring.datasource.* 不会绑定任何池参数（Druid 走自身默认值）
  redis:
    host: 127.0.0.1
    port: 16379
    password: 12345678
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    status-page-url: http://localhost:18007/doc.html
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 3000
  mapper-locations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.zhuawa.shop.seckill.model
