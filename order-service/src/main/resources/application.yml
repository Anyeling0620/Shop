server:
  port: 18002
spring:
  application:
    name: order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/order?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 12345678
    type: com.alibaba.druid.pool.DruidDataSource
    # ---- Druid 连接池（已引入 druid-spring-boot-starter，这些参数会真正绑定）----
    # 改前走 Druid 默认值 maxActive=8 / maxWait=-1（无限等待），高并发下
    # 大量 Tomcat 线程阻塞在 DruidDataSource.takeLast。
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 32
      max-wait: 3000          # 毫秒；绝不能配 -1
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    status-page-url: http://localhost:18002/doc.html
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 3000
  mapper-locations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.zhuawa.shop.order.model