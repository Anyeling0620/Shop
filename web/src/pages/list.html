<div class="wrap crumbs"><a href="/index.html">首页</a><span>/</span><span>全部商品</span></div>

<section class="wrap listPage">
  <h1 class="listPage__title">全部商品</h1>
  <div class="listPage__body">
    <aside class="filters-panel" aria-label="筛选">
      <h2>商品分类</h2>
      <ul id="catFilter">
        <li><button type="button" data-cat="" aria-pressed="true">全部</button></li>
        __CATLINKS__
      </ul>
      <h2>价格区间</h2>
      <ul id="priceFilter">
        <li><button type="button" data-price="" aria-pressed="true">不限</button></li>
        <li><button type="button" data-price="0-3000">3000 以下</button></li>
        <li><button type="button" data-price="3000-6000">3000–6000</button></li>
        <li><button type="button" data-price="6000-10000">6000–10000</button></li>
        <li><button type="button" data-price="10000-999999">10000 以上</button></li>
      </ul>
    </aside>

    <div class="listPage__main">
      <div class="listPage__bar">
        <p id="listCount">共 __COUNT__ 件商品</p>
        <label class="sort">排序
          <select id="sortBy">
            <option value="default">综合</option>
            <option value="asc">价格从低到高</option>
            <option value="desc">价格从高到低</option>
          </select>
        </label>
      </div>
      <ul class="rows__grid" id="productGrid">__CARDS__</ul>
      <p class="listPage__empty" id="listEmpty" hidden>没有符合条件的商品，换个筛选条件试试。</p>
    </div>
  </div>
</section>
