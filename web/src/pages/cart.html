<div class="wrap crumbs"><a href="/index.html">首页</a><span>/</span><span>购物车</span></div>

<section class="wrap cartPage">
  <h1 class="listPage__title">购物车</h1>
  <div id="cartEmpty" class="cartPage__empty">
    <p>购物车还是空的。</p>
    <a class="btn" href="/list/index.html">去逛逛</a>
  </div>

  <div id="cartBody" hidden>
    <table class="cartTable">
      <thead>
        <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th><span class="sr">操作</span></th></tr>
      </thead>
      <tbody id="cartRows"></tbody>
    </table>
    <div class="cartPage__foot">
      <button type="button" class="cartPage__clear" id="cartClear">清空购物车</button>
      <p>合计：<b id="cartTotal">￥0</b></p>
      <button type="button" class="btn btn--buy" id="checkout">去结算</button>
    </div>
    <p class="cartPage__note" id="cartNote" role="status"></p>
  </div>
</section>
