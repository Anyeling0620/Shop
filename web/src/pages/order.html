<div class="wrap crumbs"><a href="/index.html">首页</a><span>/</span><span id="orderCrumb">订单</span></div>

<section class="wrap orderPage">
  <div class="orderPage__head">
    <h1 id="orderTitle">订单</h1>
    <p id="orderSubtitle"></p>
  </div>

  <div class="orderPage__card" id="orderEmpty" hidden>
    <p id="orderEmptyText">还没有待展示的订单。</p>
    <a class="btn" href="/list/index.html">去逛逛</a>
  </div>

  <!-- 结算确认 -->
  <div class="orderPage__card" id="checkoutBody" hidden>
    <ul class="orderPage__items" id="checkoutItems"></ul>
    <p class="orderPage__total">应付合计：<b id="checkoutTotal">￥0.00</b></p>
    <form id="checkoutForm">
      <div class="field">
        <label for="receiveAddress">收货地址</label>
        <input id="receiveAddress" type="text" placeholder="请输入收货地址" autocomplete="street-address">
      </div>
      <div class="field">
        <label for="payType">支付方式</label>
        <select id="payType" style="width:100%;height:58px;border:1px solid #f6f6f6;border-radius:4px;padding:0 14px;background:#f6f6f6;font-size:13px">
          <option value="0">在线支付</option>
          <option value="1">货到付款</option>
        </select>
      </div>
      <div class="field">
        <label for="consumerMsg">备注</label>
        <input id="consumerMsg" type="text" placeholder="选填" maxlength="255">
      </div>
      <p class="acct__err" id="checkoutErr" role="alert"></p>
      <div class="orderPage__actions">
        <a class="btn btn--ghost" href="/cart/index.html">返回购物车</a>
        <button class="btn btn--buy" type="submit" id="submitOrder">提交订单</button>
      </div>
    </form>
  </div>

  <!-- 订单详情 -->
  <div class="orderPage__card" id="orderBody" hidden>
    <dl class="orderPage__meta">
      <div><dt>订单号</dt><dd id="orderNo">—</dd></div>
      <div><dt>下单时间</dt><dd id="orderTime">—</dd></div>
      <div><dt>状态</dt><dd id="orderStatus">—</dd></div>
      <div><dt>支付方式</dt><dd id="orderPayType">—</dd></div>
    </dl>
    <p class="orderPage__addr" id="orderAddress"></p>
    <p class="orderPage__addr" id="orderMsg" hidden></p>
    <ul class="orderPage__items" id="orderItems"></ul>
    <p class="orderPage__total">应付合计：<b id="orderTotal">￥0.00</b></p>
    <div class="orderPage__actions">
      <a class="btn" href="/index.html">继续购物</a>
      <a class="btn btn--ghost" href="/list/index.html">再逛逛</a>
    </div>
  </div>
</section>
