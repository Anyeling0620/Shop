<div class="acct__bar">
  <p class="acct__cookie">本网站使用 Cookie 保存必要信息，以保证页面正常运行并帮助我们改进体验。继续使用本站，即表示您接受这些 Cookie。<a href="#">同意且不再提示</a></p>
  <div class="acct__bar-in">
    <a class="acct__logo" href="/index.html" aria-label="商城首页"><img src="../assets/logo.svg" width="178" height="36" alt="NOVA store"></a>
    <button class="acct__close" type="button" aria-label="关闭"><img src="../assets/close.svg" width="23" height="23" alt=""></button>
  </div>
</div>

<section class="acct" aria-label="会员登录">
  <div class="wrap acct__band">
    <div class="acct__intro">
      <h2>登录后查看我的优惠券</h2>
      <p>登录即可查看券包、领取新人礼，并对已领取的券进行管理。</p>
      <ul class="acct__perks">
        <li><b>新人礼</b><span>首次登录立减 50</span></li>
        <li><b>整机券</b><span>满 1000 减 100</span></li>
        <li><b>教育认证</b><span>学生教师再减 300</span></li>
      </ul>
      <a class="acct__scan" href="#" aria-label="扫码登录更安全">
        <img src="../assets/qr.svg" width="96" height="96" alt="">
        <span>扫码登录更安全</span>
      </a>
    </div>

    <div class="acct__card">
      <h1>会员登录</h1>
      <p class="acct__hint" id="loginNext" hidden>登录后将返回刚才的页面继续操作。</p>
      <ul class="acct__tabs" role="tablist">
        <li><a href="#" role="tab" aria-selected="true">快捷登录</a></li>
        <li><a href="#" role="tab" aria-selected="false">账号密码登录</a></li>
      </ul>
      <form action="#" method="post" novalidate>
        <div class="field">
          <label class="sr" for="phone">手机号</label>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="请输入手机号">
        </div>
        <div class="field">
          <label class="sr" for="code">短信验证码</label>
          <div class="field__row">
            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入验证码">
            <button class="field__code" type="button">获取验证码</button>
          </div>
        </div>
        <div class="acct__agree">
          <input id="agree" type="checkbox" checked class="sr">
          <img class="acct__tick" src="../assets/check.svg" width="16" height="16" alt="已勾选">
          <label for="agree">如果您输入的手机号未注册，将为您进行注册，注册即表示您同意
            <a href="#">注册协议（服务条款）</a>、<a href="#">隐私政策</a>、<a href="#">销售条款</a></label>
        </div>
        <button class="acct__go" type="submit">登录</button>
      </form>
      <a class="acct__reg" href="#">注册账号 ›</a>
      <div class="acct__alt">
        <span>其他登录方式</span>
        <ul>
          <li><button type="button" aria-label="i-account"><img src="../assets/i-account.svg" width="40" height="40" alt=""></button></li>
          <li><button type="button" aria-label="i-code"><img src="../assets/i-code.svg" width="40" height="40" alt=""></button></li>
          <li><button type="button" aria-label="i-phone"><img src="../assets/i-phone.svg" width="40" height="40" alt=""></button></li>
          <li><button type="button" aria-label="i-mail"><img src="../assets/i-mail.svg" width="40" height="40" alt=""></button></li>
        </ul>
      </div>
    </div>
  </div>
</section>
