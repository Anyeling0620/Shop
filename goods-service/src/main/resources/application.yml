server:
  port: 18001
  tomcat:
    # 默认 100，改为 1 万：避免服务端每 100 个请求就主动 FIN 断开
    # 高并发压测下这会让客户端建连速率骤降，避免 TIME_WAIT/临时端口耗尽
    max-keep-alive-requests: 10000
    # 连接建立/请求头读取超时（毫秒），防止半开连接长期占位
    connection-timeout: 20000
spring:
  application:
    name: goods
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/goods?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 12345678
    type: com.alibaba.druid.pool.DruidDataSource
    # ---- Druid 连接池（已引入 druid-spring-boot-starter，这些参数会真正绑定）----
    # 改前走 Druid 默认值 maxActive=8 / maxWait=-1（无限等待），300 并发下
    # 200 个 Tomcat 线程里有 184 个卡在 DruidDataSource.takeLast。
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 32          # 与 Tomcat 线程数匹配，避免取连接排队
      max-wait: 3000          # 毫秒；绝不能配 -1（无限等待会让线程永久挂住）
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  web:
    resources:
      static-locations: classpath:/static/
      chain:
        enabled: true
  # 与 seckill-service 共用同一套本地 redis
  redis:
    host: 127.0.0.1
    port: 16379
    password: 12345678
    # 不使用 Lettuce 连接池（保持 Spring 默认 shareNativeConnection=true）。
    # 实测：Lettuce 线程安全且命令多路复用，对本地 Redis（RTT 微秒级）共享单连接吞吐更高。
    # 开启连接池后同一端点 100 并发 QPS 从约 5000 掉到约 2000（max-active=16 形成排队）。
    # 除非将来真的出现「慢命令/大 key 阻塞所有请求」，否则不要打开池化。

# 多级缓存（Caffeine L1 + Redis L2 + MySQL L3）可调参数
zhuawa:
  cache:
    # ---- HeavyKeeper 热点 key 检测参数（迁移自 yu-like）----
    topk: 100                # 只保留最热的 k 个 key
    width: 100000            # 哈希桶宽度，越大冲突越少、内存占用越高
    depth: 5                 # 哈希表深度，决定指纹冲突的抗噪能力
    decay: 0.92              # 衰减系数，桶计数被挤出时的衰减概率基数
    min-count: 10            # 计数低于该值不进入 TopK
    fading-interval-ms: 20000 # 热点衰减周期（毫秒），默认 20 秒
    # ---- Caffeine 本地缓存 ----
    local-maximum-size: 1000 # 本地缓存最大条目数
    local-expire-seconds: 300 # 本地缓存写入后过期时间（秒）
    # ---- Redis L2 ----
    redis-expire-seconds: 1800 # 商品详情在 Redis 中的过期时间（秒）

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
  instance:
    status-page-url: http://localhost:18001/doc.html
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 3000
  mapper-locations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.zhuawa.shop.goods.model
