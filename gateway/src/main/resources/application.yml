server:
  port: 8081
spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]': # 匹配所有请求
            # 设置允许的域名
            allowedOrigins:
              - "http://localhost:18004"
            # 允许所有头信息
            allowedHeaders: "*"
            # 设置允许携带cookie
            # 为true时allowedOrigins不允许为* 会报错
            allowCredentials: true
            allowedMethods: # 支持的方法
              - GET
              - POST
              - PUT
              - DELETE
      routes:
        - id: zhuawa_shop_goods_route
          uri: http://localhost:18001
          predicates:
          - Path=/goods/**
          filters:
          - StripPrefix=1 # 跳过 goods
          # ------------------------------------------------------------------
          # 压测期已停用 IP 维度限流。
          # 原配置 replenishRate=1 / burstCapacity=5 会把 /goods/** 硬顶在约 1 QPS，
          # 任何压测数字都会被这层令牌桶掩盖，测不出真实容量上限。
          # 压测结束后如需恢复，把下面 5 行的注释去掉即可（ipKeyResolver Bean 仍保留）。
          # ------------------------------------------------------------------
          # - name: RequestRateLimiter #请求数限流 名字不能随便写 ，使用默认的factory
          #   args:
          #     key-resolver: "#{@ipKeyResolver}"
          #     redis-rate-limiter.replenishRate: 1 # 允许用户每秒处理多少个请求
          #     redis-rate-limiter.burstCapacity: 5 # 令牌桶的容量，允许在一秒钟内完成的最大请求数
        - id: zhuawa_shop_user_route
          uri: http://localhost:18006
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1 # 跳过 users
        # ------------------------------------------------------------------
        # order / seckill 由 lb://order、lb://seckill 改为直连。
        # 原因：lb:// 每次请求都要走 Eureka 服务发现 + Spring Cloud LoadBalancer
        # 选实例，实测比直连多约 20ms；本机单实例部署下这层开销纯属浪费。
        # 取舍：失去负载均衡与实例自动上下线能力。若将来要给 order / seckill
        # 扩成多实例，把下面的 uri 改回 lb://order、lb://seckill 即可
        # （Eureka 注册配置未动，服务仍在注册，可直接切回）。
        # 端口必须与各服务 server.port 保持一致：order=18002，seckill=18007。
        # ------------------------------------------------------------------
        - id: zhuawa_shop_order_route
          uri: http://localhost:18002       # ← 直连（原 lb://order）
          predicates:
            - Path=/order/**
          filters:
            - StripPrefix=1 # 跳过 order
        - id: zhuawa_shop_seckill_route
          uri: http://localhost:18007       # ← 直连（原 lb://seckill）
          predicates:
            - Path=/seckill/**
          filters:
            - StripPrefix=1 # 跳过 seckill，前端请求 /seckill/seckill/**
        - id: zhuawa_shop_search_route
          uri: http://localhost:18003
          predicates:
            - Path=/search/**
          filters:
            - StripPrefix=1 # 跳过 search，前端请求 /search/goods/search/{page}/{size}
  redis:
    host: 127.0.0.1
    port: 16379
    password: 12345678
    # 不使用 Lettuce 连接池（保持 Spring 默认 shareNativeConnection=true）。
    # 实测：Lettuce 线程安全且命令多路复用，对本地 Redis（RTT 微秒级）共享单连接吞吐更高。
    # 开启连接池后同一端点 100 并发 QPS 从约 5000 掉到约 2000（max-active=16 形成排队）。
    # 除非将来真的出现「慢命令/大 key 阻塞所有请求」，否则不要打开池化。
    # 注：本网关当前 Redis 只服务限流器，而 RequestRateLimiter 在压测期被注释禁用。

# ----------------------------------------------------------------------
# 压测期日志降级：AuthFilter.java:50 每个请求都执行 logger.info("uri: {}")，
# 属于同步 IO，跑在只有 32 个 Reactor 事件循环线程的 WebFlux 模型上。
# 压测期间该日志已把 GatewayApp.out.log 写到 448MB，是最可疑的网关瓶颈。
# 这里把包级日志降到 WARN，用于 A/B 对照验证；验证完可删除本段。
# ----------------------------------------------------------------------
logging:
  level:
    com.zhuawa.shop.gateway.filter.AuthFilter: WARN

auth:
  skip:
    urls: http://localhost:8081/user/user/login/do_login

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
